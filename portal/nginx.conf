server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Upstreams are resolved per request (variables below), so nginx
    # boots without them and follows container restarts / new IPs.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # SPA: all non-file requests -> index.html (never cached, so a rebuild is picked up at once)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Proxy catalog-api
    location ^~ /api/catalog/ {
        set $catalog_upstream http://catalog-api:8000;
        rewrite ^/api/catalog/(.*)$ /$1 break;
        proxy_pass $catalog_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Proxy chatbot API
    location ^~ /api/chat/ {
        set $chat_upstream http://fastapi:8000;
        rewrite ^/api/chat/(.*)$ /$1 break;
        proxy_pass $chat_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Vite's hashed bundles only
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
