connector.name=delta_lake

# File metastore trên MinIO (thay Hive Metastore). Spark đăng ký bảng qua
# CALL delta.system.register_table(...) — xem register_catalog_tables() trong spark/app/common/catalog.py.
hive.metastore=file
hive.metastore.catalog.dir=s3://trino-metastore/
delta.register-table-procedure.enabled=true

# S3/MinIO Configuration
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.aws-access-key=admin
s3.aws-secret-key=password123
s3.path-style-access=true

# Delta Lake specific
delta.enable-non-concurrent-writes=true
