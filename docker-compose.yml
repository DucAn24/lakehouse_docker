# ==========================================
# E-Commerce & Clickstream Lakehouse — Docker Compose
# ==========================================
# Bản chuyển đổi từ Helm chart (helm/lakehouse) sang Docker Compose.
#   docker compose up -d                  → core ETL stack (Postgres, MinIO, Kafka, Debezium, Polaris, Trino, Spark, Airflow)
#   docker compose --profile apps up -d   → thêm Metabase, Grafana, Kafka UI, FastAPI chatbot, Catalog API, Portal, Polaris Console
# Bảng: Apache Iceberg; catalog: Apache Polaris (Iceberg REST) tên `lakehouse`, dùng chung cho Spark, Trino, PyIceberg, DuckDB...
# Biến môi trường lấy từ .env (copy từ .env.example).
# ==========================================

x-common-env: &common-env
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
  POSTGRES_DB: ${POSTGRES_DB:-orders}
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-admin}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-password123}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  S3_ENDPOINT: http://minio:9000
  POLARIS_URI: http://polaris:8181/api/catalog
  POLARIS_CLIENT_ID: ${POLARIS_ROOT_CLIENT_ID:-root}
  POLARIS_CLIENT_SECRET: ${POLARIS_ROOT_CLIENT_SECRET:-s3cr3t}
  ICEBERG_CATALOG: lakehouse
  KAFKA_BROKER: kafka:9092
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  TRINO_HOST: trino
  TRINO_PORT: "8080"
  TRINO_CATALOG: lakehouse
  TRINO_SCHEMA: gold
  TRINO_USER: admin

# Polaris lưu metadata trong database `polaris` của service postgres (relational-jdbc)
x-polaris-db-env: &polaris-db-env
  POLARIS_PERSISTENCE_TYPE: relational-jdbc
  POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql
  QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/polaris
  QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
  QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-123456}

x-spark-image: &spark-image
  build: ./spark
  image: ${SPARK_IMAGE:-spark-lakehouse:latest}

services:
  # ================== 01. DATA TIER ==================
  postgres:
    image: postgres:15-alpine
    command: ["postgres", "-c", "wal_level=logical"]
    environment: *common-env
    ports: ["5432:5432"]
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
      - ${DATASET_DIR:-../dataset}:/data:ro
      - ./postgres/sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: ${POSTGRES_MEM_LIMIT:-512m}
    restart: unless-stopped

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment: *common-env
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: ${MINIO_MEM_LIMIT:-512m}
    restart: unless-stopped

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    environment: *common-env
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set myminio http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do
          echo "  → MinIO not ready, retrying in 5s..."; sleep 5
        done
        # Một bucket cho cả lakehouse: Polaris đặt bảng ở s3://lakehouse/<namespace>/<table>
        mc mb myminio/lakehouse --ignore-existing
        echo "✓ Bucket created: lakehouse"
    restart: "no"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms256m -Xmx512m}
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports: ["29092:29092"]
    volumes:
      - ./data/kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    mem_limit: ${KAFKA_MEM_LIMIT:-1g}
    restart: unless-stopped

  # ================== 02. PROCESSING TIER ==================
  connect:
    image: debezium/connect:2.7.0.Final
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: "1"
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      ENABLE_DEBEZIUM_SCRIPTING: "false"
      HEAP_OPTS: ${CONNECT_HEAP_OPTS:--Xms256m -Xmx512m}
    ports: ["8083:8083"]
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    mem_limit: ${CONNECT_MEM_LIMIT:-1g}
    restart: unless-stopped

  connect-init:
    image: curlimages/curl:latest
    environment:
      CONNECT_URL: http://connect:8083
    volumes:
      - ./connectors:/connectors:ro
    depends_on:
      connect: { condition: service_healthy }
    entrypoint: ["/bin/sh", "/connectors/register-connectors.sh"]
    restart: "no"

  # Apache Polaris — Iceberg REST catalog `lakehouse` dùng chung cho mọi engine.
  # Không vend credential (MinIO, stsUnavailable): client dùng key MinIO của chính nó.
  polaris-db-init:
    image: postgres:15-alpine
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-123456}
      PGDATABASE: ${POSTGRES_DB:-orders}
    depends_on:
      postgres: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # init-databases.sh chỉ chạy khi volume postgres còn trống → tạo DB polaris nếu thiếu
        psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'polaris'" | grep -q 1           || psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE polaris"
        echo "✓ Database polaris ready"
    restart: "no"

  polaris-bootstrap:
    image: apache/polaris-admin-tool:${POLARIS_VERSION:-1.7.0}
    environment: *polaris-db-env
    # Idempotent: realm đã bootstrap thì bỏ qua (credential root giữ nguyên)
    command:
      - bootstrap
      - --realm=POLARIS
      - --credential=POLARIS,${POLARIS_ROOT_CLIENT_ID:-root},${POLARIS_ROOT_CLIENT_SECRET:-s3cr3t}
    depends_on:
      polaris-db-init: { condition: service_completed_successfully }
    restart: "no"

  polaris:
    image: apache/polaris:${POLARIS_VERSION:-1.7.0}
    environment:
      <<: *polaris-db-env
      POLARIS_REALM_CONTEXT_REALMS: POLARIS
      QUARKUS_OTEL_SDK_DISABLED: "true"
      polaris.readiness.ignore-severe-issues: "true"
      # Polaris tự ghi metadata.json lên MinIO bằng key này (endpointInternal của catalog)
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-admin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-password123}
      # Polaris Console (profile apps) gọi API thẳng từ trình duyệt
      QUARKUS_HTTP_CORS_ENABLED: "true"
      QUARKUS_HTTP_CORS_ORIGINS: http://localhost:8088
      QUARKUS_HTTP_CORS_METHODS: GET,POST,PUT,DELETE,PATCH,HEAD,OPTIONS
      QUARKUS_HTTP_CORS_HEADERS: "*"
    ports: ["8181:8181", "8182:8182"]
    depends_on:
      polaris-bootstrap: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "--fail", "-s", "http://localhost:8182/q/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    mem_limit: ${POLARIS_MEM_LIMIT:-768m}
    restart: unless-stopped

  # Tạo catalog `lakehouse`, quyền, namespace bronze/silver/gold/monitoring (idempotent)
  polaris-init:
    image: curlimages/curl:latest
    environment: *common-env
    volumes:
      - ./polaris/init.sh:/polaris/init.sh:ro
    depends_on:
      polaris: { condition: service_healthy }
    entrypoint: ["/bin/sh", "/polaris/init.sh"]
    restart: "no"

  trino:
    image: trinodb/trino:483
    environment: *common-env  # lakehouse.properties đọc key Polaris/MinIO từ biến môi trường (ENV:...)
    ports: ["8081:8080"]
    volumes:
      - ./trino/config.properties:/etc/trino/config.properties:ro
      - ./trino/catalog/lakehouse.properties:/etc/trino/catalog/lakehouse.properties:ro
    depends_on:
      polaris-init: { condition: service_completed_successfully }
    mem_limit: ${TRINO_MEM_LIMIT:-1500m}
    restart: unless-stopped

  # ================== 03. SPARK TIER ==================
  spark-master:
    <<: *spark-image
    hostname: spark-master
    command: ["bash", "-c", "/opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host spark-master"]
    environment:
      <<: *common-env
      SPARK_MODE: master
      SPARK_MASTER_PORT: "7077"
    ports: ["8080:8080"]
    volumes:
      - ./spark/app:/opt/spark/app
    mem_limit: ${SPARK_MASTER_MEM_LIMIT:-768m}
    restart: unless-stopped

  spark-worker:
    <<: *spark-image
    command: ["bash", "-c", "/opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077"]
    environment:
      <<: *common-env
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_MASTER_PORT: "7077"
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2g}
    volumes:
      - ./spark/app:/opt/spark/app
    depends_on:
      - spark-master
    mem_limit: ${SPARK_WORKER_MEM_LIMIT:-2500m}
    restart: unless-stopped

  # ================== 04. AIRFLOW TIER ==================
  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    image: ${AIRFLOW_IMAGE:-airflow-lakehouse:latest}
    command:
      - bash
      - -c
      - |
        airflow db migrate
        airflow users create -u airflow -p airflow -f Airflow -l Admin -r Admin -e airflow@example.com || true
        airflow api-server -p 8080 &
        airflow dag-processor &
        airflow triggerer &
        exec airflow scheduler
    environment:
      <<: *common-env
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-123456}@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW_CONN_SPARK_DEFAULT: spark://spark-master:7077
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
      AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: "300"
      SPARK_EXECUTOR_MEMORY: ${SPARK_EXECUTOR_MEMORY:-1500m}
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-512m}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    ports: ["8084:8080"]
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./spark/app:/opt/spark/app
      - ./dbt:/opt/airflow/dbt
    depends_on:
      postgres: { condition: service_healthy }
      spark-master: { condition: service_started }
      polaris-init: { condition: service_completed_successfully }
    mem_limit: ${AIRFLOW_MEM_LIMIT:-2g}
    restart: unless-stopped

  # ================== 05. APPS TIER (profile: apps) ==================
  metabase:
    image: metabase/metabase:latest
    profiles: ["apps"]
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: "5432"
      MB_DB_USER: ${POSTGRES_USER:-postgres}
      MB_DB_PASS: ${POSTGRES_PASSWORD:-123456}
      MB_DB_HOST: postgres
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: ${METABASE_MEM_LIMIT:-1500m}
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    profiles: ["apps"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: trino-datasource 1.2.0
      # Slack-compatible webhook for alert rules; the default is a dead address so provisioning
      # still loads and alerts are only visible in the Grafana UI
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-http://127.0.0.1:9/alert-webhook-not-configured}
    ports: ["3001:3000"]
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./data/grafana:/var/lib/grafana
    depends_on:
      - trino
    mem_limit: ${GRAFANA_MEM_LIMIT:-512m}
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    profiles: ["apps"]
    environment:
      KAFKA_CLUSTERS_0_NAME: kraft-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: PLAINTEXT
      KAFKA_CLUSTERS_0_READONLY: "false"
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium-connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
    ports: ["8085:8080"]
    depends_on:
      - kafka
    mem_limit: ${KAFKA_UI_MEM_LIMIT:-512m}
    restart: unless-stopped

  fastapi:
    build: ./api
    image: ${FASTAPI_IMAGE:-lakehouse-fastapi:latest}
    profiles: ["apps"]
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      <<: *common-env
      MIMO_API_KEY: ${MIMO_API_KEY:-}
      MIMO_BASE_URL: ${MIMO_BASE_URL:-https://api.xiaomimimo.com/v1}
      MIMO_MODEL: ${MIMO_MODEL:-mimo-v2.5}
      # Bind mount từ Windows không phát sự kiện inotify → dùng polling cho --reload
      WATCHFILES_FORCE_POLLING: "true"
    ports: ["8000:8000"]
    volumes:
      - ./api:/app
      - ./dbt/models:/dbt/models:ro  # table/column docs + FKs for the chatbot's schema prompt
    depends_on:
      - trino
    mem_limit: ${FASTAPI_MEM_LIMIT:-512m}
    restart: unless-stopped

  catalog-api:
    build: ./catalog-api
    image: ${CATALOG_API_IMAGE:-lakehouse-catalog-api:latest}
    profiles: ["apps"]
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      <<: *common-env
      DBT_MODELS_DIR: /dbt/models
      TABLES_PY_PATH: /common/tables.py
      CORS_ORIGINS: ${CATALOG_CORS_ORIGINS:-http://localhost:3002}
      WATCHFILES_FORCE_POLLING: "true"
    ports: ["8087:8000"]
    volumes:
      - ./catalog-api:/app
      - ./dbt:/dbt:ro
      - ./spark/app/common:/common:ro
    depends_on:
      - trino
      - polaris
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: ${CATALOG_API_MEM_LIMIT:-512m}
    restart: unless-stopped

  portal:
    build: ./portal
    image: ${PORTAL_IMAGE:-lakehouse-portal:latest}
    profiles: ["apps"]
    ports: ["3002:80"]
    depends_on:
      - catalog-api
      - fastapi
    mem_limit: ${PORTAL_MEM_LIMIT:-256m}
    restart: unless-stopped

  # Web UI của Polaris (catalog, namespace, bảng, principal/role). Chưa có image chính thức →
  # build từ apache/polaris-tools, pin commit. Đăng nhập bằng POLARIS_ROOT_CLIENT_ID/SECRET.
  polaris-console:
    build:
      context: https://github.com/apache/polaris-tools.git#8ffe1e52ed78579a815905d8414702d1082e5a18:console
      dockerfile: docker/Dockerfile
    image: ${POLARIS_CONSOLE_IMAGE:-lakehouse-polaris-console:latest}
    profiles: ["apps"]
    environment:
      # Trình duyệt gọi thẳng Polaris → dùng cổng publish trên host (CORS đã mở cho :8088)
      VITE_POLARIS_API_URL: http://localhost:8181
      VITE_OAUTH_TOKEN_URL: http://localhost:8181/api/catalog/v1/oauth/tokens
      VITE_POLARIS_REALM: POLARIS
      VITE_POLARIS_REALM_HEADER_NAME: Polaris-Realm
      VITE_POLARIS_PRINCIPAL_SCOPE: PRINCIPAL_ROLE:ALL
    ports: ["8088:8080"]
    depends_on:
      - polaris
    mem_limit: ${POLARIS_CONSOLE_MEM_LIMIT:-256m}
    restart: unless-stopped
