# Unity Catalog OSS server config (mount vào /home/unitycatalog/etc/conf/server.properties)
# Credential (s3.accessKey.N / s3.secretKey.N) truyền qua biến môi trường trong docker-compose.yml —
# UC đọc env trùng tên key trước khi đọc file này.
server.env=dev
server.authorization=disable
server.authorization-url=
server.token-url=
server.client-id=
server.client-secret=
server.redirect-port=
server.allowed-issuers=
server.audiences=
server.cookie-timeout=P5D
server.access-token-timeout=PT24H

# Bảng của pipeline là EXTERNAL (Spark ghi Delta theo path, rồi đăng ký LOCATION) — không cần managed storage.
server.managed-table.enabled=false

## S3 (MinIO) per-bucket config
# Không có session token → UC gọi STS AssumeRole (endpoint MinIO qua AWS_ENDPOINT_URL_STS) và vend
# credential tạm thời có scope theo path. MinIO bỏ qua RoleArn, nhưng UC yêu cầu giá trị khác rỗng.
# UC chỉ chấp nhận scheme s3:// (không phải s3a://).
s3.bucketPath.0=s3://bronze
s3.region.0=us-east-1
s3.awsRoleArn.0=arn:aws:iam::000000000000:role/unitycatalog

s3.bucketPath.1=s3://silver
s3.region.1=us-east-1
s3.awsRoleArn.1=arn:aws:iam::000000000000:role/unitycatalog

s3.bucketPath.2=s3://gold
s3.region.2=us-east-1
s3.awsRoleArn.2=arn:aws:iam::000000000000:role/unitycatalog
