# Connection to the stack's Trino; the env vars come from x-common-env in docker-compose.yml.
lakehouse:
  target: prod
  outputs:
    prod:
      type: trino
      method: none
      http_scheme: http
      host: "{{ env_var('TRINO_HOST', 'trino') }}"
      port: "{{ env_var('TRINO_PORT', '8080') | int }}"
      user: "{{ env_var('TRINO_USER', 'admin') }}"
      database: "{{ env_var('TRINO_CATALOG', 'lakehouse') }}"
      schema: gold
      threads: "{{ env_var('DBT_THREADS', '2') | int }}"
