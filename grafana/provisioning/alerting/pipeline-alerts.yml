# Grafana alerting provisioning: rules query the monitoring tables through Trino.
# Generated once from the dashboard SQL; edit freely. Notifications go to $ALERT_WEBHOOK_URL (Slack-compatible).
apiVersion: 1
contactPoints:
- orgId: 1
  name: lakehouse-webhook
  receivers:
  - uid: lakehouse-webhook-slack
    type: slack
    settings:
      url: ${ALERT_WEBHOOK_URL}
policies:
- orgId: 1
  receiver: lakehouse-webhook
  group_by:
  - alertname
  repeat_interval: 12h
groups:
- orgId: 1
  name: pipeline-monitoring
  folder: Lakehouse
  interval: 5m
  rules:
  - uid: lakehouse-stale-tables
    title: Lakehouse tables are stale
    condition: C
    for: 5m
    noDataState: OK
    execErrState: Error
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: trino-delta
      model:
        refId: A
        format: 1
        rawSQL: 'SELECT count(*) AS stale_tables FROM (SELECT layer, table_name, max(recorded_at) AS last_success

          FROM delta.monitoring.pipeline_metrics WHERE status = ''success'' GROUP BY layer, table_name) o

          WHERE date_diff(''minute'', CAST(o.last_success AS timestamp(3)), CAST(current_timestamp AT TIME ZONE ''UTC'' AS timestamp(3))) > 1560'
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        datasource:
          type: __expr__
          uid: __expr__
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        datasource:
          type: __expr__
          uid: __expr__
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    annotations:
      summary: At least one table has had no successful write for more than 26 h
      dashboard_url: /d/lakehouse-monitoring
    labels:
      severity: critical
  - uid: lakehouse-failed-jobs
    title: Lakehouse job failed
    condition: C
    for: 0s
    noDataState: OK
    execErrState: Error
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: trino-delta
      model:
        refId: A
        format: 1
        rawSQL: "SELECT count(*) AS failed_tables FROM (SELECT layer, table_name, status, row_count, write_mode, rows_inserted, rows_updated, rows_deleted, duration_sec,\n    row_number() OVER (PARTITION BY layer, table_name ORDER BY recorded_at DESC) AS rn\nFROM delta.monitoring.pipeline_metrics) l WHERE rn = 1 AND status = 'failed'"
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        datasource:
          type: __expr__
          uid: __expr__
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        datasource:
          type: __expr__
          uid: __expr__
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    annotations:
      summary: The latest run of at least one table failed
      dashboard_url: /d/lakehouse-monitoring
    labels:
      severity: critical
  - uid: lakehouse-dq-failures
    title: Lakehouse data quality checks failing
    condition: C
    for: 0s
    noDataState: OK
    execErrState: Error
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: trino-delta
      model:
        refId: A
        format: 1
        rawSQL: SELECT count(*) AS failed_checks FROM delta.monitoring.data_quality_log WHERE NOT passed AND (layer, checked_at) IN (SELECT layer, max(checked_at) FROM delta.monitoring.data_quality_log GROUP BY layer)
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        datasource:
          type: __expr__
          uid: __expr__
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        datasource:
          type: __expr__
          uid: __expr__
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    annotations:
      summary: The latest data quality run has failing checks
      dashboard_url: /d/lakehouse-monitoring
    labels:
      severity: warning
