connector.name=iceberg

# Iceberg REST catalog = Apache Polaris (catalog `lakehouse`), the same catalog Spark writes to,
# so every table Spark or dbt creates is visible here without registration.
# Values come from the container environment (x-common-env in docker-compose.yml, tests/iceberg_lake.py).
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=${ENV:POLARIS_URI}
iceberg.rest-catalog.warehouse=${ENV:ICEBERG_CATALOG}
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential=${ENV:POLARIS_CLIENT_ID}:${ENV:POLARIS_CLIENT_SECRET}
iceberg.rest-catalog.oauth2.scope=PRINCIPAL_ROLE:ALL
# No credential vending: Trino reads/writes with its own S3 keys below
iceberg.rest-catalog.vended-credentials-enabled=false
iceberg.format-version=2

# S3 (SeaweedFS)
fs.native-s3.enabled=true
s3.endpoint=${ENV:S3_ENDPOINT}
s3.region=${ENV:AWS_REGION}
s3.aws-access-key=${ENV:AWS_ACCESS_KEY_ID}
s3.aws-secret-key=${ENV:AWS_SECRET_ACCESS_KEY}
s3.path-style-access=true
